<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UX Audit Agency</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #111827;
      --gray-600: #4b5563;
      --gray-500: #6b7280;
      --gray-400: #9ca3af;
      --gray-300: #d1d5db;
      --gray-200: #e5e7eb;
      --gray-100: #f3f4f6;
      --gray-50:  #f9fafb;
      --white:    #ffffff;
      --red:      #dc2626;
      --amber:    #d97706;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      border-bottom: 1px solid var(--gray-200);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; }
    .topbar-title { font-size: 15px; font-weight: 800; letter-spacing: -0.5px; }
    .topbar-subtitle { font-size: 12px; color: var(--gray-400); }
    .topbar-sep { color: var(--gray-200); }
    .api-key-row { display: flex; align-items: center; gap: 8px; }
    .api-key-label { font-size: 11px; color: var(--gray-400); }
    .api-key-input {
      border: 1px solid var(--gray-200);
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 11px;
      width: 210px;
      font-family: monospace;
      outline: none;
    }
    .api-key-input:focus { border-color: var(--gray-500); }

    /* ── Split panels ── */
    .panels { display: flex; flex: 1; overflow: hidden; }

    .left-panel {
      width: 340px;
      flex-shrink: 0;
      border-right: 1px solid var(--gray-100);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .right-panel {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    /* ── Shared typography ── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--gray-500);
      margin-bottom: 10px;
    }
    .divider { border: none; border-top: 1px solid var(--gray-100); }

    /* ── Input form ── */
    .url-input {
      width: 100%;
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      color: var(--black);
    }
    .url-input:focus { border-color: var(--gray-500); }
    .url-input::placeholder { color: var(--gray-400); }

    .or-divider {
      font-size: 11px;
      color: var(--gray-400);
      text-align: center;
      margin: 4px 0;
    }

    .drop-zone {
      border: 1px dashed var(--gray-200);
      border-radius: 6px;
      padding: 14px;
      text-align: center;
      font-size: 12px;
      color: var(--gray-400);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--gray-500);
      background: var(--gray-50);
    }
    .drop-zone.has-file { border-color: var(--black); color: var(--black); }

    .run-btn {
      width: 100%;
      background: var(--black);
      color: var(--white);
      border: none;
      border-radius: 5px;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: opacity 0.15s;
    }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .run-btn:hover:not(:disabled) { opacity: 0.85; }
    /* Busy state: stay full-black (not faded) and sweep a shimmer so it reads as
       actively working. Placed after :disabled so it wins on equal specificity. */
    .run-btn.busy {
      opacity: 1;
      cursor: progress;
      position: relative;
      overflow: hidden;
    }
    .run-btn.busy::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 25%, rgba(255,255,255,0.22) 50%, transparent 75%);
      transform: translateX(-100%);
      animation: run-shimmer 1.15s ease-in-out infinite;
    }
    @keyframes run-shimmer { to { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) {
      .run-btn.busy::after { animation: none; }
    }

    /* ── Orchestrator status (shown after audit) ── */
    #orchestratorStatus { display: none; }
    .page-type-label { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
    .agent-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .agent-row.visible { opacity: 1; transform: translateY(0); }
    .agent-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .agent-dot.active { background: var(--black); }
    .agent-dot.skipped { background: var(--gray-200); }
    .agent-name { font-size: 13px; font-weight: 600; }
    .agent-name.skipped { color: var(--gray-300); font-weight: 400; }
    .agent-reason { font-size: 11px; color: var(--gray-400); margin-left: auto; }

    .timing-row {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--gray-100);
      font-size: 11px;
      color: var(--gray-400);
    }
    .timing-value { color: var(--black); font-weight: 600; }

    /* ── Right panel ── */
    .right-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      font-size: 13px;
      color: var(--gray-400);
    }

    .findings-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .findings-count { color: var(--gray-300); font-weight: 400; margin-left: 6px; }
    .findings-sort-label { font-size: 11px; color: var(--gray-400); }

    .finding-row {
      border-top: 1px solid var(--gray-100);
      padding: 16px 0;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .finding-row.visible { opacity: 1; transform: translateY(0); }

    .finding-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .severity-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .severity-dot.critical { background: var(--red); }
    .severity-dot.major    { background: var(--amber); }
    .severity-dot.minor    { background: var(--gray-400); }

    .severity-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .severity-label.critical { color: var(--red); }
    .severity-label.major    { color: var(--amber); }
    .severity-label.minor    { color: var(--gray-500); }

    .finding-category { font-size: 11px; color: var(--gray-400); }
    .source-tag {
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-left: auto;
    }
    .source-tag.fallback {
      color: var(--gray-500);
      border: 1px solid var(--gray-300);
      border-radius: 3px;
      padding: 1px 4px;
      margin-left: auto;
    }
    .fallback-banner {
      font-size: 11px;
      color: var(--gray-500);
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      padding: 6px 10px;
      margin-bottom: 12px;
    }

    .finding-title { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
    .finding-description { font-size: 13px; color: var(--gray-600); margin-bottom: 6px; line-height: 1.5; }
    .finding-location { font-size: 11px; color: var(--gray-400); margin-bottom: 8px; }
    .finding-fix {
      font-size: 12px;
      color: var(--gray-600);
      background: var(--gray-50);
      border-radius: 4px;
      padding: 7px 10px;
      line-height: 1.5;
    }
    .finding-fix code {
      font-family: monospace;
      font-size: 11px;
      background: var(--gray-100);
      padding: 1px 4px;
      border-radius: 2px;
    }

    .show-more-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-top: 1px solid var(--gray-100);
      padding: 14px 0;
      font-size: 12px;
      color: var(--gray-400);
      cursor: pointer;
      font-family: var(--font);
    }
    .show-more-btn:hover { color: var(--black); }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">UX Audit Agency</span>
      <span class="topbar-sep">·</span>
      <span class="topbar-subtitle">Powered by Claude</span>
    </div>
    <div class="api-key-row">
      <span class="api-key-label">Real audit · key stays on the server</span>
    </div>
  </div>

  <div class="panels">
    <div class="left-panel" id="leftPanel">

      <!-- Input section -->
      <div id="inputSection">
        <div class="section-label">Input</div>
        <input type="url" class="url-input" id="urlInput" placeholder="https://yoursite.com">
        <div class="or-divider">or</div>
        <div class="drop-zone" id="dropZone">
          <span id="dropLabel">Drop screenshots here · or click to browse</span>
          <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
        </div>
        <div style="margin-top:12px">
          <button class="run-btn" id="runBtn">Run audit</button>
        </div>
      </div>

      <hr class="divider">

      <!-- Orchestrator status (hidden until audit runs) -->
      <div id="orchestratorStatus">
        <div class="section-label">Orchestrator</div>
        <div class="page-type-label" id="pageTypeLabel"></div>
        <div style="font-size:11px;color:var(--gray-500);margin-bottom:8px;">Agents spawned</div>
        <div id="agentList"></div>
        <div class="timing-row">
          Completed in <span class="timing-value" id="timingValue">—</span>
        </div>
      </div>

    </div>
    <div class="right-panel" id="rightPanel"></div>
  </div>

  <script>
    // ── Main run handler ───────────────────────────────────────────────────
    async function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = e => resolve({
          base64: e.target.result.split(',')[1],
          mediaType: file.type || 'image/png'
        });
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Prettify a subagent name from .claude/agents (e.g. "visual-hierarchy" → "Visual / Hierarchy").
    function prettyAgent(name) {
      return name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' / ');
    }

    function addAgentRow(name) {
      const agentList = document.getElementById('agentList');
      const row = document.createElement('div');
      row.className = 'agent-row';
      row.innerHTML = `
        <div class="agent-dot active"></div>
        <span class="agent-name">${escapeHtml(prettyAgent(name))}</span>
        <span class="agent-reason">${name === 'synthesizer' ? 'ranking & dedupe' : 'analyzing…'}</span>
      `;
      agentList.appendChild(row);
      requestAnimationFrame(() => row.classList.add('visible'));
    }

    // Read a Server-Sent Events stream from a fetch Response, invoking onEvent per JSON payload.
    async function readSse(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split('\n\n');
        buffer = chunks.pop();
        for (const chunk of chunks) {
          const line = chunk.split('\n').find(l => l.startsWith('data:'));
          if (line) { try { onEvent(JSON.parse(line.slice(5).trim())); } catch {} }
        }
      }
    }

    async function runAudit() {
      const urlVal = document.getElementById('urlInput').value.trim();
      const runBtn = document.getElementById('runBtn');

      if (!urlVal && !uploadedFiles.length) { alert('Enter a URL or drop a screenshot to audit.'); return; }
      if (urlVal && !urlVal.startsWith('http')) { alert('Please enter a full URL including https://'); return; }

      // Reset panels and show the orchestrator status.
      renderEmptyState();
      const agentList = document.getElementById('agentList');
      agentList.innerHTML = '';
      document.getElementById('orchestratorStatus').style.display = 'block';
      const label = urlVal
        ? (() => { try { return new URL(urlVal).host; } catch { return urlVal; } })()
        : `Screenshot · ${uploadedFiles[0].name}`;
      document.getElementById('pageTypeLabel').textContent = label;
      document.getElementById('timingValue').textContent = '…';

      runBtn.disabled = true;
      runBtn.classList.add('busy');
      runBtn.textContent = 'Analyzing…';

      try {
        let body;
        if (urlVal) {
          body = { url: urlVal };
        } else {
          const img = await readFileAsBase64(uploadedFiles[0]);
          body = { image: img.base64, mediaType: img.mediaType };
        }
        const res = await fetch('/api/audit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok || !res.body) throw new Error(`server responded ${res.status}`);

        await readSse(res, (ev) => {
          if (ev.type === 'agent') {
            addAgentRow(ev.agent);
          } else if (ev.type === 'findings') {
            // Synthesis is done → every dispatched agent has finished.
            document.querySelectorAll('#agentList .agent-reason')
              .forEach(el => el.textContent = 'done');
            renderFindings(ev.findings || []);
          } else if (ev.type === 'done') {
            document.getElementById('timingValue').textContent = `${ev.seconds}s · $${ev.cost}`;
          } else if (ev.type === 'error') {
            document.getElementById('pageTypeLabel').textContent = 'Audit failed — see console';
            console.error('Audit error:', ev.message);
          }
        });
      } catch (err) {
        console.error('Audit failed:', err);
        document.getElementById('pageTypeLabel').textContent = 'Audit failed — is the server running?';
      } finally {
        runBtn.disabled = false;
        runBtn.classList.remove('busy');
        runBtn.textContent = 'Run audit';
      }
    }

    document.getElementById('runBtn').addEventListener('click', runAudit);
  </script>

  <script>
    // ── Renderer ───────────────────────────────────────────────────────────
    function renderEmptyState() {
      document.getElementById('rightPanel').innerHTML = `
        <div class="right-empty" style="flex-direction:column;gap:10px;text-align:center">
          <div style="font-size:28px;opacity:0.15">◎</div>
          <div>Paste a URL or upload screenshots to begin.</div>
          <div style="font-size:11px;color:var(--gray-300)">Audit takes ~15–30 seconds</div>
        </div>`;
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function findingHtml(f) {
      return `
        <div class="finding-meta">
          <div class="severity-dot ${f.severity}"></div>
          <span class="severity-label ${f.severity}">${f.severity}</span>
          <span class="finding-category">${escapeHtml(f.agent)} · ${escapeHtml(f.category)}</span>
          <span class="source-tag ${f.source}">${escapeHtml(f.source || '')}</span>
        </div>
        <div class="finding-title">${escapeHtml(f.title)}</div>
        <div class="finding-description">${escapeHtml(f.description)}</div>
        <div class="finding-location">Location: ${escapeHtml(f.location)}</div>
        <div class="finding-fix">Fix: ${escapeHtml(f.fix)}</div>
      `;
    }

    function renderFindings(findings) {
      const panel = document.getElementById('rightPanel');
      const VISIBLE = 5;
      const top = findings.slice(0, VISIBLE);
      const rest = findings.slice(VISIBLE);

      const fallbackAgents = [...new Set(
        findings.filter(f => f.source === 'fallback').map(f => f.agent)
      )];
      const bannerHtml = fallbackAgents.length
        ? `<div class="fallback-banner">Some findings are sample data — ${fallbackAgents.length} agent${fallbackAgents.length > 1 ? 's' : ''} couldn't complete.</div>`
        : '';

      let html = `
        <div class="findings-header">
          <div class="section-label">
            Findings <span class="findings-count">${findings.length} total</span>
          </div>
          <div class="findings-sort-label">sorted by severity</div>
        </div>
        ${bannerHtml}
      `;

      top.forEach((f, i) => {
        html += `<div class="finding-row visible" id="finding-${i}">${findingHtml(f)}</div>`;
      });

      if (rest.length) {
        const restHtml = rest.map((f, i) =>
          `<div class="finding-row" id="finding-${VISIBLE + i}" style="display:none">${findingHtml(f)}</div>`
        ).join('');
        html += restHtml;
        html += `<button class="show-more-btn" id="showMoreBtn">+ ${rest.length} more finding${rest.length > 1 ? 's' : ''}</button>`;
      }

      panel.innerHTML = html;

      if (rest.length) {
        let expanded = false;
        document.getElementById('showMoreBtn').addEventListener('click', () => {
          expanded = !expanded;
          rest.forEach((_, i) => {
            const el = document.getElementById(`finding-${VISIBLE + i}`);
            el.style.display = expanded ? 'block' : 'none';
            if (expanded) setTimeout(() => el.classList.add('visible'), 20);
            else el.classList.remove('visible');
          });
          document.getElementById('showMoreBtn').textContent = expanded
            ? '− Show fewer'
            : `+ ${rest.length} more finding${rest.length > 1 ? 's' : ''}`;
        });
      }
    }

    // Init empty state on load
    renderEmptyState();
  </script>

  <script>
    // Drop zone wiring
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const dropLabel = document.getElementById('dropLabel');
    let uploadedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(Array.from(e.dataTransfer.files));
    });
    fileInput.addEventListener('change', () => handleFiles(Array.from(fileInput.files)));

    function handleFiles(files) {
      const images = files.filter(f => f.type.startsWith('image/'));
      if (!images.length) return;
      uploadedFiles = images;
      dropLabel.textContent = `${images.length} screenshot${images.length > 1 ? 's' : ''} ready`;
      dropZone.classList.add('has-file');
      document.getElementById('urlInput').value = '';
    }
  </script>

</body>
</html>
